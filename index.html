<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="یک شب شیفت در پمپ‌بنزین بین‌راهی. تصمیمش با توئه.">
<meta property="og:title" content="کیلومتر ۲۱۴">
<meta property="og:description" content="یک شب شیفت در پمپ‌بنزین بین‌راهی. تصمیمش با توئه.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>کیلومتر ۲۱۴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Nastaliq+Urdu:wght@500&family=Vazirmatn:wght@400;600;800;900&display=swap">
<style>
/* Layout concept: one vertical night-shift "screen"; the HUD is the station's own fuel-price board. */
:root{
  --night:#05070a; --fg:#f4f7f0; --dim:#a6b4ac;
  --sodium:#ffb43a; --tube:#d5f5dc; --alarm:#ff4a3d; --radio:#7fe3ff;
  --paper:#ebe5d4; --ink:#1b2a5c; --panel:#0b1013;
  --sans:Vazirmatn,Tahoma,system-ui,sans-serif;
  --display:Lalezar,Vazirmatn,Tahoma,sans-serif;
  --hand:"Noto Nastaliq Urdu",Vazirmatn,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--fg);font-family:var(--sans);overflow:hidden;display:flex;justify-content:center}
#stage{position:relative;width:min(100%,calc(100dvh*.5625));height:100%;overflow:hidden;background:#000;container-type:size;direction:rtl;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sodium);outline-offset:2px}

/* One quiet status line */
#hud{position:absolute;top:0;inset-inline:0;display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:2.6cqw max(4cqw,env(safe-area-inset-right,0px)) 5cqw max(4cqw,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.7),transparent);pointer-events:none}
#hud-top{order:2;flex:none}
#hud-day{display:none}
#mute{background:none;border:0;font-size:3cqw;padding:.6cqw 0;color:var(--dim);pointer-events:auto}
#hud-grid{display:flex;align-items:baseline;gap:3.6cqw;min-width:0}
.cell{display:flex;align-items:baseline;gap:1cqw;min-width:0}
.cell small{font-size:2.9cqw;color:var(--dim);font-weight:600}
.cell b{font-size:3.5cqw;font-weight:800;color:var(--fg);white-space:nowrap;font-variant-numeric:tabular-nums}
.cell:first-child small{display:none}
.cell:first-child b{font-family:var(--display);font-weight:400;font-size:6cqw;color:var(--sodium)}

/* Captions */
#scrim{position:absolute;inset-inline:0;bottom:0;height:34cqh;background:linear-gradient(transparent,rgba(0,0,0,.9) 62%);pointer-events:none}
#cap{position:absolute;inset-inline:6cqw;bottom:7cqh;text-align:center;pointer-events:none;transition:opacity .16s}
#cap small{display:block;font-size:3.3cqw;font-weight:800;margin-bottom:1cqw;letter-spacing:0}
#cap p{margin:0;font-weight:800;font-size:6.5cqw;line-height:1.5;text-wrap:balance;text-shadow:0 .3cqw 0 #000,0 0 3cqw #000,0 0 6cqw #000}
#cap span{display:inline-block;opacity:0;animation:w .26s forwards;margin-inline-end:.26em}
@keyframes w{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
#cap.officer small,#cap.officer p{color:var(--sodium)}
#cap.radio small,#cap.radio p,#cap.carradio small,#cap.carradio p{color:var(--radio)}
#cap.you small,#cap.you p{color:var(--tube)}
#cap.kid small,#cap.kid p{color:#ffd7a8}
#cap.shout small,#cap.shout p{color:var(--alarm)}
#cap.shout p{font-size:8cqw;font-weight:900}
#cap.run p{color:var(--alarm);font-size:12cqw;font-weight:900;animation:jit .08s infinite}
@keyframes jit{0%{transform:translate(0,0) rotate(-1.5deg)}33%{transform:translate(.15em,-.1em) rotate(1.5deg)}66%{transform:translate(-.12em,.08em) rotate(-.5deg)}100%{transform:translate(0,0) rotate(1deg)}}
#note .shake{display:inline-block;color:#8a1a14;font-size:1.45em;animation:jit .09s infinite}
#sms{position:absolute;inset-inline:8cqw;top:20cqh;background:#e9e9ee;color:#111;border-radius:4cqw;padding:3.6cqw 4.4cqw;box-shadow:0 2cqw 10cqw rgba(0,0,0,.8);animation:pop .25s ease-out}
#sms.out{background:#2f7d5b;color:#fff}#sms.out small{color:#d5f5dc}
#sms small{display:block;font-size:3.2cqw;color:#666;font-weight:600;margin-bottom:1.4cqw}
#sms p{margin:0;font-size:5.6cqw;font-weight:800;line-height:1.6}
@media (prefers-reduced-motion:reduce){#cap.run p,#note .shake{animation:none}}

/* Choice */
#choice{position:absolute;inset-inline:0;bottom:0;padding:4cqw max(5cqw,env(safe-area-inset-right,0px)) 6cqw max(5cqw,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(0,0,0,.93) 16%);animation:rise .24s ease-out}
@keyframes rise{from{transform:translateY(12%);opacity:0}to{transform:none;opacity:1}}
#rule{font-size:3.5cqw;color:var(--alarm);font-weight:800;text-align:center;margin:0 0 1cqw}
#q{font-family:var(--display);font-size:9.2cqw;line-height:1.3;text-align:center;margin:0 0 2.4cqw;text-wrap:balance}
#bar{height:1.3cqw;background:#23292a;border-radius:1cqw;overflow:hidden;margin-bottom:3cqw}
#fill{height:100%;background:var(--alarm);width:100%;margin-inline-start:auto}
#opts{display:grid;gap:2.2cqw}
.opt{background:#10171a;border:2px solid #3a4a44;border-radius:1.6cqw;padding:3.2cqw 3cqw;font-size:5cqw;font-weight:800;line-height:1.4}
.opt:hover,.opt:active{background:var(--tube);color:#0a0f0c;border-color:var(--tube)}

/* Emergency alert */
#alert{position:absolute;inset-inline:6cqw;top:17cqh;background:#161a1d;border:2px solid var(--alarm);border-radius:3.4cqw;padding:4.4cqw;box-shadow:0 0 12cqw rgba(255,74,61,.4);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
#alert h2{margin:0;font-size:5.6cqw;font-weight:900;color:var(--alarm)}
#alert h3{margin:.6cqw 0 3cqw;font-size:3.4cqw;font-weight:600;color:var(--dim)}
#alert ol{margin:0;padding:0;list-style:none;display:grid;gap:2.3cqw}
#alert li{font-size:5cqw;font-weight:800;line-height:1.5;animation:w .3s}
#alert li.new{color:var(--alarm)}

/* The note */
#note{position:absolute;inset-inline:9cqw;top:16cqh;background:var(--paper);color:var(--ink);padding:7cqw 6cqw 6cqw;transform:rotate(-2.2deg);box-shadow:0 3cqw 10cqw rgba(0,0,0,.8);animation:pop .3s ease-out}
#note p{margin:0;font-family:var(--hand);font-size:6cqw;line-height:2.25}
#note span.w{opacity:0;animation:w .35s forwards}
#note.forged p,#note.forged time{color:#7a1a14}
#note.forged{transform:rotate(1.6deg)}
#note time{display:block;margin-top:3cqw;font-family:var(--hand);font-size:4.6cqw;line-height:2.2;text-align:left}

/* Sound hint: browsers keep audio off until the first touch */
#tap{position:absolute;top:13cqw;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);border:1px solid #3a4a44;color:var(--dim);font-size:3.4cqw;font-weight:600;padding:1.4cqw 3.4cqw;border-radius:5cqw;white-space:nowrap;pointer-events:none;transition:opacity .4s}
#tap.gone{opacity:0}
/* Title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3cqw;padding-inline:8cqw;text-align:center;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,.5),rgba(0,0,0,.2) 70%)}
#title h1{margin:0;font-family:var(--display);font-weight:400;font-size:21cqw;line-height:1.1;color:var(--sodium);text-shadow:0 0 6cqw rgba(255,180,58,.7);animation:buzz 5s infinite}
@keyframes buzz{0%,91%,95%,100%{opacity:1}93%{opacity:.35}}
#title p{margin:0;font-size:4.5cqw;line-height:1.8;font-weight:600;text-shadow:0 0 3cqw #000}
#title small{font-size:3.4cqw;color:var(--dim)}
.ghost{background:transparent;color:var(--sodium);border:2px solid var(--sodium);border-radius:1.6cqw;padding:2.6cqw 7cqw;font-size:4.6cqw;font-weight:800}
.primary{background:var(--sodium);color:#141006;border:0;border-radius:1.6cqw;padding:3.4cqw 9cqw;font-size:5.4cqw;font-weight:900}

/* Shift receipt ending */
#end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:5cqw;background:rgba(0,0,0,.72);overflow-y:auto;animation:pop .35s}
#receipt{background:var(--paper);color:#17181a;width:100%;padding:5cqw;font-size:3.7cqw;line-height:1.7}
#receipt h2{margin:0;font-family:var(--display);font-weight:400;font-size:10cqw;line-height:1.25;text-align:center}
#receipt .head{text-align:center;font-weight:600;font-size:3.2cqw;margin:0}
#receipt .blurb{text-align:center;margin:1.4cqw 0 2.6cqw;font-weight:600}
#receipt ul{list-style:none;margin:0;padding:2.4cqw 0;border-block:2px dashed #66645c;display:grid;gap:1cqw}
#receipt .tally{display:flex;justify-content:space-between;gap:2cqw;font-weight:800;margin:2.4cqw 0;font-variant-numeric:tabular-nums}
#receipt .next{text-align:center;font-weight:800;margin:0 0 2.4cqw}
#end-btns{display:grid;gap:2cqw}
#end-btns button{border-radius:1.2cqw;padding:2.8cqw;font-size:4.3cqw;font-weight:800;border:2px solid #17181a;background:transparent;color:#17181a}
#end-btns .go{background:#17181a;color:var(--paper)}
@media (prefers-reduced-motion:reduce){#title h1{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-hidden="true"></canvas>
  <div id="hud" hidden>
    <div id="hud-top"><span id="hud-day"></span><button id="mute" type="button">صدا: روشن</button></div>
    <div id="hud-grid">
      <div class="cell"><small>ساعت</small><b id="h-clock"></b></div>
      <div class="cell"><small>چراغ</small><b id="h-light"></b></div>
      <div class="cell"><small>آب</small><b id="h-water"></b></div>
      <div class="cell"><small>چیپس</small><b id="h-chips"></b></div>
    </div>
  </div>
  <div id="scrim"></div>
  <div id="cap" role="status" aria-live="polite"></div>
  <div id="sms" hidden><small id="sms-from">شماره ناشناس</small><p id="sms-text"></p></div>
  <div id="alert" hidden><h2>هشدار اضطراری</h2><h3 id="alert-sub"></h3><ol id="rules"></ol></div>
  <div id="note" hidden><p id="note-text"></p><time id="note-date"></time></div>
  <div id="choice" hidden>
    <p id="rule"></p><h2 id="q"></h2>
    <div id="bar"><div id="fill"></div></div>
    <div id="opts"></div>
  </div>
  <div id="tap" aria-live="polite">برای صدا، یه بار صفحه رو لمس کن</div>
  <div id="end" hidden></div>
</div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const fa=x=>String(x).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const clone=o=>JSON.parse(JSON.stringify(o));
const val=(x,...a)=>typeof x==="function"?x(...a):x;
const CANCEL={};
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const G={speed:1};

function faDate(offset){
  const d=new Date(Date.now()+offset*864e5);
  try{return new Intl.DateTimeFormat("fa-IR-u-ca-persian",{day:"numeric",month:"long"}).format(d)}
  catch(e){return offset?"فردا":"امروز"}
}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* ---------- state ---------- */
const S0=()=>({night:1,clock:123,lights:"on",back:false,looked:false,spoke:false,water:90,chips:400,log:[]});
const V0=()=>({shot:"highway",lamps:14,car:1100,officer:0,oX:360,oS:1.32,paper:0,door:0,door2:0,shadow:0,hand:0,radio:0,dawn:0,black:0,flash:0,shake:0,speak:0,youSpeak:0,fear:.05,phone:0,cabin:0,knockT:-9999,knockK:"",day:0,dome:0,driver:1,holder:0,mirror:0,broken:0,walker:0,cardoor:0,card:1,feet:1,sign:0,sroom:0,ghost:0,notep:0,struggle:0,lunge:0,grab:0,runner2:0,board:0,wbroken:0,speed:0,cars:0,moving:0,swap4:0,sleep:0,copcar:0,fast:0,radioOn:0,pdoor:0,exit:0,runpov:0,approach:0,kidIn:0,kidChips:0,dblAt:0,walkOut:0,walkBack:0,manTurn:0,manNear:0,track:.5,kdoor:0,pull:0,slowBlink:0,leadMan:0,chaseYou:0,snatch:0,exitH:0,walkDoor:0,tryDoor:0,hdoor:0,hspin:1,heli:0,heliOut:0,stood:0,walkOut7:0,lift:0,boardH:0,town:0,landed:0,door9:0,camLed:0,pcar:0,goIn:0,arrest:0,grab:0,dissolve:0,noOfficer:0,alone7:0,bars:0,hugKid:0,youCell:0,reach:0,press:0,fadeDbl:0,finA:0,enter:0,dbl6:0,scribble:0,repair:0,gone6:0,shopEmpty:0,fbroken:0,runner:0,keys:0,rear:0,roadman:0});
let S=S0(),V=V0(),run=0,skip=null,checkpoint=null,tweens=[];

function wait(ms,my,skippable){
  return new Promise((res,rej)=>{
    const done=()=>{if(skip===fin)skip=null;my===run?res():rej(CANCEL)};
    const t=setTimeout(done,ms*G.speed);
    const fin=()=>{clearTimeout(t);done()};
    if(skippable)skip=fin;
  });
}
function tween(k,to,ms,c){
  tweens=tweens.filter(t=>t.k!==k);
  tweens.push({k,c,from:V[k],to,t0:performance.now(),d:Math.max(1,ms*G.speed)});
}

/* ---------- HUD ---------- */
const LIGHT={on:"روشن",fridge:"یخچال",off:"خاموش"};
function hud(){
  const h=Math.floor(S.clock/60)%24,m=S.clock%60;
  $("h-clock").textContent=fa(String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"));
  $("h-light").textContent=V.day>.5?"روز":LIGHT[S.lights];
  $("h-water").textContent=fa(S.water);
  $("h-chips").textContent=fa(S.chips);
  $("hud-day").textContent="شب "+fa(S.night)+" از "+fa(7)+" · "+faDate(0);
}

/* ---------- audio: a score and the effects, all generated in the browser ---------- */
const A={ctx:null,muted:false};
const live=()=>A.ctx&&A.ctx.state==="running";
function impulse(c,sec,decay){
  const r=c.sampleRate,n=Math.floor(r*sec),b=c.createBuffer(2,n,r);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}
  return b;
}
function audioInit(){
  if(A.ctx){if(A.ctx.state!=="running")A.ctx.resume().catch(()=>{});return}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  const c=A.ctx=new AC();
  A.master=c.createGain();A.master.gain.value=A.muted?0:.9;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.25;
  A.master.connect(comp);comp.connect(c.destination);
  /* one room for everything: a long, dark tail */
  A.verb=c.createConvolver();A.verb.buffer=impulse(c,3.8,2.4);
  const vf=c.createBiquadFilter();vf.type="lowpass";vf.frequency.value=3600;
  const vr=c.createGain();vr.gain.value=.6;A.verb.connect(vf);vf.connect(vr);vr.connect(A.master);
  A.sfx=c.createGain();A.sfx.connect(A.master);
  const ss=c.createGain();ss.gain.value=.24;A.sfx.connect(ss);ss.connect(A.verb);
  A.music=c.createGain();A.music.gain.value=.5;A.music.connect(A.master);
  const ms=c.createGain();ms.gain.value=.7;A.music.connect(ms);ms.connect(A.verb);
  A.echo=c.createDelay(1.5);A.echo.delayTime.value=.42;
  const fb=c.createGain();fb.gain.value=.36;const ef=c.createBiquadFilter();ef.type="lowpass";ef.frequency.value=2200;
  A.echo.connect(ef);ef.connect(fb);fb.connect(A.echo);ef.connect(A.music);
  const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; A.noise=b;
  /* room tone: wind against the glass, and the fluorescent hum */
  const wf=c.createBiquadFilter();wf.type="bandpass";wf.frequency.value=380;wf.Q.value=.7;
  const wl=c.createOscillator();wl.frequency.value=.05;const wlg=c.createGain();wlg.gain.value=160;wl.connect(wlg);wlg.connect(wf.frequency);wl.start();
  const wg=c.createGain();wg.gain.value=.05;
  const w=c.createBufferSource();w.buffer=b;w.loop=true;w.connect(wf);wf.connect(wg);wg.connect(A.master);w.start();
  A.humG=c.createGain();A.humG.gain.value=.03;
  const hf=c.createBiquadFilter();hf.type="lowpass";hf.frequency.value=700;
  const h=c.createOscillator();h.type="sawtooth";h.frequency.value=100;h.connect(hf);hf.connect(A.humG);A.humG.connect(A.master);h.start();
  /* the dread layer rises with the story's tension: a growling low drone and two beating high strings */
  A.dread=c.createGain();A.dread.gain.value=0;
  const df=c.createBiquadFilter();df.type="lowpass";df.frequency.value=260;df.Q.value=7;
  [55,55.4,82.6].forEach(f=>{const o=c.createOscillator();o.type="sawtooth";o.frequency.value=f;o.connect(df);o.start()});
  const lfo=c.createOscillator();lfo.frequency.value=.07;const lg=c.createGain();lg.gain.value=150;lfo.connect(lg);lg.connect(df.frequency);lfo.start();
  df.connect(A.dread);
  [1318.5,1396.9].forEach((f,i)=>{
    const o=c.createOscillator();o.frequency.value=f;const g2=c.createGain();g2.gain.value=.06;
    const t=c.createOscillator();t.frequency.value=5.3+i*.9;const tg=c.createGain();tg.gain.value=.05;t.connect(tg);tg.connect(g2.gain);
    o.connect(g2);g2.connect(A.dread);o.start();t.start();
  });
  A.dread.connect(A.master);const dv=c.createGain();dv.gain.value=.5;A.dread.connect(dv);dv.connect(A.verb);
  /* the pad under the theme */
  A.pad=[0,1,2,3].map(()=>{
    const g2=c.createGain();g2.gain.value=0;const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=520;f.Q.value=1;
    const os=[0,1].map(k=>{const o=c.createOscillator();o.type="sawtooth";o.detune.value=k?7:-7;o.connect(f);o.start();return o});
    f.connect(g2);g2.connect(A.music);return{g:g2,os};
  });
  MUS.next=c.currentTime+.4;MUS.step=0;
  setInterval(score,120);
}
function level(node,v,t){
  if(node===A.dread)MUS.int=Math.min(1,v/.22);
  if(A.ctx&&node)node.gain.setTargetAtTime(v,A.ctx.currentTime,t||.5);
}
function tone(f,dur,vol,type,at,endF){
  if(!live())return; const c=A.ctx,t=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(endF)o.frequency.exponentialRampToValueAtTime(endF,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  o.connect(g);g.connect(A.sfx);o.start(t);o.stop(t+dur+.02);
}
function burst(dur,vol,freq,kind,at,Q){
  if(!live())return; const c=A.ctx,t=c.currentTime+(at||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=A.noise;f.type=kind||"bandpass";f.frequency.value=freq;f.Q.value=Q||1;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  s.connect(f);f.connect(g);g.connect(A.sfx);s.start(t,Math.random());s.stop(t+dur+.02);
}
/* a struck, ringing partial: glass, metal, bells */
const ring=(f,dur,vol,at)=>tone(f,dur,vol,"sine",at);

/* ---- the theme: a music box that can't quite remember its tune, over a slow minor pad ---- */
const MUS={int:0,next:0,step:0,rng:seeded(214)};
const STEP=.62;
const CHORDS=[[110,164.81,220,261.63],[87.31,130.81,174.61,220],[73.42,146.83,174.61,220],[82.41,123.47,164.81,207.65]];
const PHRASES=[
  [0,null,3,null,2,null,-5,null,-4,null,-5,null,null,null,null,null],
  [0,null,3,null,7,null,5,3,2,null,null,null,-1,null,null,null],
  [-5,null,-4,null,0,null,-1,null,-5,null,null,-7,-6,null,null,null],
];
let phrase=PHRASES[0];
function bell(f,t,vol){
  const c=A.ctx;
  [[1,1],[2.76,.32],[5.4,.1]].forEach(([m,a])=>{
    const o=c.createOscillator(),g=c.createGain();o.frequency.value=f*m;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*a,t+.006);g.gain.exponentialRampToValueAtTime(.0003,t+2.8/m+.4);
    o.connect(g);g.connect(A.music);g.connect(A.echo);o.start(t);o.stop(t+3.4);
  });
}
function score(){
  if(!live()||A.muted)return;
  const c=A.ctx;
  if(MUS.next<c.currentTime)MUS.next=c.currentTime+.05;
  while(MUS.next<c.currentTime+.5){
    const t=MUS.next,i=MUS.step%16,bar=Math.floor(MUS.step/16),hi=MUS.int;
    if(i===0){
      phrase=PHRASES[Math.floor(MUS.rng()*PHRASES.length)];
      const ch=CHORDS[bar%4];
      A.pad.forEach((p,k)=>{p.os.forEach(o=>o.frequency.setTargetAtTime(ch[k],t,.8));p.g.gain.setTargetAtTime(.02+hi*.012,t,1.6)});
    }
    const n=phrase[i];
    /* as the night tightens, the box goes wrong: notes drop out, a tritone creeps in */
    if(n!==null&&MUS.rng()>hi*.35){
      const f=440*Math.pow(2,n/12)*(hi>.7&&MUS.rng()<.3?Math.pow(2,6/12):1);
      bell(f,t+(MUS.rng()-.5)*.03*hi,.055);
    }
    if(hi>.45&&i%4===2)bell(55*Math.pow(2,(bar%2)/12)*4,t,.03*hi);
    MUS.next+=STEP*(1-hi*.18);MUS.step++;
  }
}

/* ---------- voice: AI clips keyed by "who|caption"; the game still runs caption-only without them ---------- */
const VO={buf:{},src:null,ready:null};
function voiceLoad(){
  if(VO.ready)return VO.ready;
  VO.ready=fetch("voice.json").then(r=>r.ok?r.json():null).then(async p=>{
    if(!p||!A.ctx)return;
    await Promise.all(Object.keys(p).map(async k=>{
      const bin=Uint8Array.from(atob(p[k]),c=>c.charCodeAt(0));
      VO.buf[k]=await A.ctx.decodeAudioData(bin.buffer);
    }));
  }).catch(()=>{});
  return VO.ready;
}
const voiceDur=(who,text)=>{const b=VO.buf[who+"|"+text];return b&&G.speed>=.5?b.duration*1000:0};
function stopVoice(){if(VO.src){try{VO.src.stop()}catch(e){}VO.src=null}}
function playVoice(who,text){
  stopVoice();
  const b=VO.buf[who+"|"+text];
  if(!b||!A.ctx||G.speed<.5)return;
  const s=A.ctx.createBufferSource();s.buffer=b;s.connect(A.master);s.start();VO.src=s;
}

const WHO={officer:"افسر پلیس",radio:"بی‌سیم",carradio:"رادیو",kid:"بچه",you:"تو",shout:"افسر پلیس",both:"هر دو"};
async function say(b,my){
  const text=val(b.say,S),who=b.who||"narr",cap=$("cap");
  cap.className=who==="both"?"shout":who; cap.textContent="";
  if(WHO[who]){const s=document.createElement("small");s.textContent=WHO[who];cap.append(s)}
  const p=document.createElement("p");
  const dur=voiceDur(who,text),words=text.split(" "),step=dur?Math.min(420,dur*.82/words.length):70;
  words.forEach((w,i)=>{const sp=document.createElement("span");sp.textContent=w;sp.style.animationDelay=(i*step*G.speed)+"ms";p.append(sp," ")});
  cap.append(p);cap.style.opacity=1;
  V.speak=(who==="officer"||who==="shout"||who==="both")?1:0;V.youSpeak=who==="you"?1:0;
  if(who==="radio"||who==="carradio"){V.radio=1;SFX.static()}
  if(who==="shout")V.shake=8;
  playVoice(who,text);
  await wait(dur?Math.max(dur+420,b.hold||0):(b.hold||1050+text.length*62),my,true);
  stopVoice();
  V.speak=0;V.youSpeak=0;V.radio=0;cap.style.opacity=0;
  await wait(130,my);
}

}

let heartT=null;
function stopHeart(){clearTimeout(heartT);heartT=null}
function choose(c,my){
  return new Promise((res,rej)=>{
    const box=$("choice"),opts=$("opts"),fill=$("fill");
    $("q").textContent=val(c.q,S);
    const rule=val(c.rule,S)||"";$("rule").textContent=rule;$("rule").hidden=!rule;
    opts.textContent="";box.hidden=false;
    const ms=c.time*1000*G.speed,t0=performance.now();
    fill.style.transition="none";fill.style.width="100%";
    void fill.offsetWidth;
    fill.style.transition="width "+ms+"ms linear";fill.style.width="0%";
    let over=false;
    const finish=o=>{
      if(over)return;over=true;clearTimeout(tm);stopHeart();removeEventListener("keydown",key);box.hidden=true;
      SFX.tick();my===run?res(o):rej(CANCEL)};
    c.options.forEach((o,i)=>{
      const b=document.createElement("button");b.type="button";b.className="opt";b.id="opt-"+i;b.textContent=val(o.label,S);
      b.onclick=e=>{e.stopPropagation();finish(o)};opts.append(b)});
    const key=e=>{const i=+e.key-1;if(c.options[i])finish(c.options[i])};
    addEventListener("keydown",key);
    const tm=setTimeout(()=>finish(c.timeout),ms);
    const beat=()=>{
      if(over||my!==run)return;
      const left=1-(performance.now()-t0)/ms;
      SFX.heart(left<.35);
      heartT=setTimeout(beat,(left<.35?520:880)*Math.max(G.speed,.05));
    };beat();
    choose.cancel=()=>finish(c.timeout);
  });
}

async function exec(beats,my){
  for(const b of beats||[]){
    if(b.if&&!b.if(S))continue;
    if(b.shot)cut(b.shot,b.hard);
    if(b.v)Object.assign(V,b.v);
    if(b.set)Object.assign(S,b.set);
    if(b.clock!==undefined){S.clock=b.clock}
    if(b.tension!==undefined)level(A.dread,b.tension,1.2);
    if(b.sfx)SFX[b.sfx]();
    if(b.tw)for(const k in b.tw)tween(k,b.tw[k][0],b.tw[k][1],b.tw[k][2]);
    hud();humFor();
    if(b.spawn)b.spawn(my).catch(()=>{});

/* knock: wind-up, contact, shudder. The sound lands on the contact, not the wind-up. */
const KN={knock:{lead:170,gap:210,n:3,back:1,shake:2.5,kick:80},bang:{lead:120,gap:140,n:5,back:1.7,shake:9,kick:150}};
const SPR={x:0,v:0,s:0,sv:0,flinch:0,fv:0,press:0,pitch:0,pv:0,carX:1100,carV:0,t0:-1,hit:-1};
function resetSprings(){Object.assign(SPR,{x:0,v:0,s:0,sv:0,flinch:0,fv:0,press:0,pitch:0,pv:0,carX:V.car,carV:0,t0:-1,hit:-1})}
function knockBack(t){
  const k=KN[V.knockK];if(!k||reduced)return 0;
  const e=t-V.knockT;if(e<0||e>k.lead+k.gap*(k.n-1)+260)return 0;
  if(e<k.lead)return k.back*EASE.out(e/k.lead);
  const h=(e-k.lead)/k.gap;
  if(h>=k.n-1)return .16*k.back*(1-sat((e-k.lead-k.gap*(k.n-1))/260))**2;
  return k.back*Math.sin(Math.PI*(h%1))**.6;
}
function stepSprings(t,dt){
  const k=KN[V.knockK];
  if(k){
    if(SPR.t0!==V.knockT){SPR.t0=V.knockT;SPR.hit=-1}
    const e=t-V.knockT-k.lead,i=e>=0?Math.floor(e/k.gap):-1;
    if(i>SPR.hit&&i<k.n){
      SPR.hit=i;SPR.press=1;
      V.shake=Math.max(V.shake,k.shake);
      if(!reduced){SPR.v+=(i%2?1:-1)*k.kick;SPR.sv+=(i%2?-.7:.7)*k.back;SPR.fv-=k.kick*1.2}
    }
  }
  SPR.press*=.8;
  SPR.v+=(-1800*SPR.x-24*SPR.v)*dt;SPR.x+=SPR.v*dt;
  SPR.sv+=(-26*SPR.s-2.2*SPR.sv)*dt;SPR.s+=SPR.sv*dt;
  SPR.fv+=(-220*SPR.flinch-20*SPR.fv)*dt;SPR.flinch+=SPR.fv*dt;
  /* the car's nose dives under braking, then settles on its springs */
  const ms=Math.max(1,dt*1000),vel=(V.car-SPR.carX)/ms,acc=(vel-SPR.carV)/ms;
  SPR.carX=V.car;SPR.carV=vel;
  const target=reduced?0:Math.min(1,Math.max(0,acc*900));
  SPR.pv+=(170*(target-SPR.pitch)-11*SPR.pv)*dt;SPR.pitch+=SPR.pv*dt;
}

/* ---- a body with two-part legs and arms. ph = walk phase in radians (undefined = standing).
   Seen from the front or the back, a step is a knee coming up and a hand swinging, not a scissor. ---- */
function limb(pts,w,col){
  g.lineCap="round";g.lineJoin="round";
  g.strokeStyle=INK;g.lineWidth=w+12;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.stroke();
  g.strokeStyle=col;g.lineWidth=w;g.stroke();
}
function rigLegs(k,ph,walk){
  [-1,1].forEach(d=>{
    const lift=walk?Math.max(0,Math.sin(ph+(d>0?0:Math.PI))):0;
    const hip=[d*60,600],knee=[d*70,990-lift*110],ank=[d*66,1380-lift*190];
    limb([hip,knee,ank],112,k.trousers||"#34405a");
    g.fillStyle="#05070b";g.beginPath();g.ellipse(ank[0]+d*8,ank[1]+34,64,30,0,0,7);g.fill();
  });
}
function rigArms(k,ph,walk,arms,sleeve,skin){
  [-1,1].forEach(d=>{
    const sw=walk?Math.sin(ph+(d>0?Math.PI:0)):0;
    const sh=[d*214,236];
    let hand=[d*238-sw*d*14,760-sw*70];
    if(arms&&arms[d<0?0:1])hand=arms[d<0?0:1];
    const mx=(sh[0]+hand[0])/2,my=(sh[1]+hand[1])/2,len=Math.hypot(hand[0]-sh[0],hand[1]-sh[1]),bend=Math.max(0,560-len)*.45;
    const elbow=[mx+d*bend,my+bend*.15];
    limb([sh,elbow,hand],80,sleeve||k.cloth);
    g.fillStyle=skin||k.skin;g.beginPath();g.arc(hand[0],hand[1]+10,34,0,7);g.fill();g.strokeStyle=INK;g.lineWidth=7;g.stroke();
  });
}
function rig(x,footY,s,k,o,ph,back){
  o=o||{};const walk=ph!==undefined&&ph!==null&&!reduced;
  const bob=walk?-Math.abs(Math.sin(ph))*18:0,y=footY-1440*s+bob*s;
  g.save();g.translate(x,y);g.scale(s,s);rigLegs(k,ph,walk);g.restore();
  if(back)backBust(x,y,s,k,o.tilt);else bust(x,y,s,{...o,k});
  g.save();g.translate(x,y);g.scale(s,s);rigArms(k,ph,walk,o.arms);g.restore();
}

function backPerson(x,footY,s,k,stride){rig(x,footY,s,k,{},stride?stride*.026:undefined,true)}
function officerRig(x,footY,s,ph,arms){

/* walk from a to b over p in [0,1]: position and a phase that advances with distance, not time */
function walkPath(a,b,p,steps){const q=sat(p);return{x:a[0]+(b[0]-a[0])*q,f:a[1]+(b[1]-a[1])*q,s:a[2]+(b[2]-a[2])*q,ph:q>0&&q<1?q*steps*Math.PI*2:undefined}}

  if(mix<1){
    g.setTransform(1,0,0,1,0,0);
    if(seam[0]==="w"){
      g.drawImage(snap,tx-cv.width*(seam==="whipL"?1:-1),0);
      g.setTransform(scale,0,0,scale,ox,oy);speedLines(false,1-Math.abs(2*mix-1));
    }else if(seam[0]==="t"){
      g.drawImage(snap,0,ty-cv.height*(seam==="tiltD"?1:-1));
      g.setTransform(scale,0,0,scale,ox,oy);speedLines(true,1-Math.abs(2*mix-1));
    }else{
      const z2=seam==="push"?1+e*.85:1-e*.26,w=cv.width,h=cv.height;
      g.globalAlpha=1-e;g.translate(w/2,h/2);g.scale(z2,z2);g.drawImage(snap,-w/2,-h/2);g.globalAlpha=1;
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- input ---------- */
/* the first touch only turns the sound on; it doesn't skip a line */
let heard=false,eatTap=false;
function unlockAudio(e){
  if(heard)return;
  audioInit();
  if(A.ctx&&A.ctx.state!=="running")A.ctx.resume().catch(()=>{});
  voiceLoad();heard=true;$("tap").classList.add("gone");
  if(e&&e.type==="pointerdown")eatTap=true;
}
addEventListener("pointerdown",unlockAudio,true);
addEventListener("keydown",unlockAudio,true);
$("stage").addEventListener("pointerup",()=>{if(eatTap){eatTap=false;return}if(skip)skip()});
$("mute").onclick=e=>{
  e.stopPropagation();A.muted=!A.muted;$("mute").textContent=A.muted?"صدا: خاموش":"صدا: روشن";
  if(A.master)A.master.gain.value=A.muted?0:.9;
};
$("mute").addEventListener("pointerup",e=>e.stopPropagation());
hud();
if(document.fonts&&document.fonts.load){document.fonts.load("400 40px Lalezar");document.fonts.load("500 40px 'Noto Nastaliq Urdu'","بذار بیام داخل")}
startFromURL();
/* some browsers let sound start on their own; then the hint has nothing to ask for */
if(A.ctx){const ok=()=>{if(A.ctx.state==="running"){heard=true;$("tap").classList.add("gone")}};A.ctx.addEventListener("statechange",ok);ok()}
window.kmDebug={G,state:()=>({S,V}),voices:()=>Object.keys(VO.buf).length,cels:()=>({n:CELS.size,mpx:celPx/1e6})};
